name: Send out DO alerts

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      force_alert:
        description:
        required: false
        default: true
        type: boolean

permissions:
  contents: write   

concurrency:
  group: erddap-alert-check
  cancel-in-progress: false 
  
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run check
        env:
          STATIONS_JSON: ${{ vars.STATIONS_JSON }}
          VALUE_COLUMN: ${{ vars.VALUE_COLUMN }}
          VALUE_LABEL: ${{ vars.VALUE_LABEL }}
          SIGNUP_SHEET_CSV_URL: ${{ vars.SIGNUP_SHEET_CSV_URL }}
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USER: ${{ vars.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          FORCE_ALERT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_alert || 'false' }}
        run: python check_and_alert.py

      - name: Commit updated state
        run: |
          git config user.name "erddap-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update alert state [skip ci]"
          git pull --rebase origin main
          git push
